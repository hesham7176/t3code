name: Android

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Unit tests
        id: unit
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee lint.log
      - name: Assemble debug APK
        id: assemble
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log
      - name: Report APK
        if: always()
        run: |
          if compgen -G 'app/build/outputs/apk/debug/*.apk' > /dev/null; then
            ls -lh app/build/outputs/apk/debug/*.apk
            sha256sum app/build/outputs/apk/debug/*.apk
          else
            echo 'No debug APK was generated.'
          fi
      - name: Upload verification logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-logs
          path: |
            unit-tests.log
            lint.log
            assemble.log
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Publish temporary success report
        if: steps.unit.outcome == 'success' && steps.lint.outcome == 'success' && steps.assemble.outcome == 'success' && github.event_name == 'push'
        run: |
          {
            echo 'JDK:'
            java -version 2>&1
            echo 'Gradle:'
            ./gradlew --version
            echo 'Android SDK:'
            sdkmanager --list 2>/dev/null | sed -n '/Installed packages:/,/Available Packages:/p' | head -40
            echo 'Tests:'
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'total={total} failures={failures} errors={errors} skipped={skipped}')
          PY
            echo 'APK:'
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%p %s bytes\n'
            sha256sum app/build/outputs/apk/debug/*.apk
          } > ci-success-report.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-success-report.txt
          git commit -m "ci: publish temporary success report [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail if verification failed
        if: steps.unit.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success'
        run: exit 1
