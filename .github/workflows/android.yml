name: Android

on:
  push:
    branches: [ main, develop, 'arena/**' ]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/commandlinetools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest" "$RUNNER_TEMP/cmdline-tools"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"
          {
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
            echo "$ANDROID_HOME/platform-tools"
          } >> "$GITHUB_PATH"
      - name: Unit tests
        id: unit
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee unit-tests.log
      - name: Lint
        id: lint
        if: always()
        run: |
          set -o pipefail
          ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee lint.log
      - name: Assemble debug APK
        id: assemble
        if: always()
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee assemble.log
      - name: Report APK
        if: always()
        run: |
          if compgen -G 'app/build/outputs/apk/debug/*.apk' > /dev/null; then
            ls -lh app/build/outputs/apk/debug/*.apk
            sha256sum app/build/outputs/apk/debug/*.apk
          else
            echo 'No debug APK was generated.'
          fi
      - name: Upload verification logs and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-logs
          path: |
            unit-tests.log
            lint.log
            assemble.log
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Publish temporary success report
        if: steps.unit.outcome == 'success' && steps.lint.outcome == 'success' && steps.assemble.outcome == 'success' && github.event_name == 'push'
        run: |
          {
            echo 'JDK:'
            java -version 2>&1
            echo 'Gradle:'
            ./gradlew --version
            echo 'Tests:'
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = failures = errors = skipped = 0
          for path in glob.glob('app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              total += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'total={total} failures={failures} errors={errors} skipped={skipped}')
          PY
            echo 'APK:'
            find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -printf '%p %s bytes\n'
            sha256sum app/build/outputs/apk/debug/*.apk
          } > ci-success-report.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-success-report.txt
          git commit -m "ci: publish temporary success report [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Fail if verification failed
        if: steps.unit.outcome != 'success' || steps.lint.outcome != 'success' || steps.assemble.outcome != 'success'
        run: exit 1
